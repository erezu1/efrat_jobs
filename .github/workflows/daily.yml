name: Daily job scan

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC = 07:15 Amsterdam (summer time)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # first run fetches every ad's detail page; later runs take minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-translate.txt

      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-nl-en-v1

      - name: Scan, score and render
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TRANSLATE_BUDGET_S: "1500"   # at most 25 min per run on whole-ad translation
        run: python -m jobscan.main

      - name: Commit results
        run: |
          git config user.name "job-scout-bot"
          git config user.email "job-scout-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Daily scan $(date -u +%F)"
          # the repo may have changed while scanning: replay our commit on top, preferring scan output
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Open digest issue (GitHub emails repo watchers)
        if: vars.DIGEST_ISSUES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/digest.md ]; then
            gh issue create --title "New job matches $(date -u +%F)" --body-file data/digest.md
          fi
